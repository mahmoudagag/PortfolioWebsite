name: Build & Push Whats the Word Image

on:
  push:
    branches:
      - main
    paths:
      - "WhatsTheWordApp/**"
      - ".github/workflows/whatstheword-cicd.yml"

jobs:
  build-whatstheword:
    runs-on: ubuntu-latest
    env:
      ECR_REPO: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/whatstheword

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and Push Image
        run: |
          docker buildx build --pull \
            --platform linux/arm64 \
            -t $ECR_REPO:latest \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            ./WhatsTheWordApp --push

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull whatstheword
            docker compose up -d whatstheword