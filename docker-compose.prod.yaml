## to build and run
## docker-compose -f docker-compose.yml -f docker-compose-production.yml up --build -d
services:
  portfoliowebsite:
    build:
      context: ./PortfolioWebsite        # Path to the Dockerfile for the backend
      dockerfile: Dockerfile    # Dockerfile name if not 'Dockerfile'
      args:
        - REACT_APP_BACKEND_URL=http://mahmoudagag.com
        - REACT_APP_PORTFOLIOWEBSITE_PORT=/
        - REACT_APP_WHATSTHEWORDAPP_PORT=/whatstheword
        - REACT_APP_STOCKPAPERTRADINGAPP_PORT=/stockpapertrading
        - REACT_APP_MEALSYAPP_PORT=/mealsy
    ports:
      - "3000:3000"             # Expose backend's port 3000
    restart: always             # Restart policy
    environment:
      - PORT=3000

  whatstheword:
    build:
      context: ./WhatsTheWordApp        # Path to the Dockerfile for the backend
      dockerfile: Dockerfile    # Dockerfile name if not 'Dockerfile'
      args:
        - REACT_APP_BASE_BACKEND_URL=http://mahmoudagag.com/
        - REACT_APP_WEBSOCKET_PATH=/whatstheword/socket.io/

    ports:
      - "5000:5000"             # Expose backend's port 3000
    restart: always             # Restart policy
    environment:
      - PORT=5000

  stockpapertrading:
    build:
      context: ./StockPaperTradingApp      
      dockerfile: Dockerfile   
      args:
        - REACT_APP_BACKEND_URL=https://mahmoudagag.com/stockpapertrading
    ports:
      - "8002:8002"             
    environment:
      PORT: 8002
      DATABASE_URL: ${STOCKTRADING_DATABASE_URL}
      API_KEY: ${API_KEY}
      JWT_ENCRIPTION_KEY: ${JWT_ENCRIPTION_KEY}
    restart: always            

 mealsy:
    build:
      context: ./Mealsy
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: https://mahmoudagag.com/mealsy
    ports:
      - "7002:7002"
    environment:
      PORT: 7002
      DATABASE_URL: ${MEALSY_DATABASE_URL}   # Provided via environment or secret manager
      JWT_SECRET: ${JWT_SECRET}
      JWT_LIFETIME: ${JWT_LIFETIME}
      API_KEY: ${API_KEY}
    restart: always


  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      DOMAIN_NAME: mahmoudagag.com
    depends_on:
      - whatstheword
      - portfoliowebsite
      - stockpapertrading
      - mealsy
