 mealsy:
    build:
      context: ./Mealsy
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: https://mahmoudagag.com/mealsy
    ports:
      - "7002:7002"
    environment:
      PORT: 7002
      DATABASE_URL: ${DATABASE_URL}   # Provided via environment or secret manager
      JWT_SECRET: ${JWT_SECRET}
      JWT_LIFETIME: ${JWT_LIFETIME}
      API_KEY: ${API_KEY}
    restart: always


  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      DOMAIN_NAME: mahmoudagag.com
    depends_on:
      - whatstheword
      - portfoliowebsite
      - stockpapertrading
      - mealsy
