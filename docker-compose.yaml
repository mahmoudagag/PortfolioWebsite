services:
  portfoliowebsite:
    build:
      context: ./PortfolioWebsite        # Path to the Dockerfile for the backend
      dockerfile: Dockerfile    # Dockerfile name if not 'Dockerfile'
      args:
        - REACT_APP_BACKEND_URL=http://localhost
        - REACT_APP_PORTFOLIOWEBSITE_PORT=/
        - REACT_APP_WHATSTHEWORDAPP_PORT=/whatstheword
        - REACT_APP_STOCKPAPERTRADINGAPP_PORT=/stockpapertrading
        - REACT_APP_MEALSYAPP_PORT=/mealsy
    ports:
      - "3002:3002"             # Expose backend's port 3000
    restart: always             # Restart policy
    environment:
      - PORT=3002

  whatstheword:
    build:
      context: ./WhatsTheWordApp        # Path to the Dockerfile for the backend
      dockerfile: Dockerfile    # Dockerfile name if not 'Dockerfile'
      args:
        - REACT_APP_BASE_BACKEND_URL=http://localhost/
        - REACT_APP_WEBSOCKET_PATH=/whatstheword/socket.io/

    ports:
      - "5002:5002"             # Expose backend's port 3000
    restart: always             # Restart policy
    environment:
      - PORT=5002

  stockpapertrading:
    build:
      context: ./StockPaperTradingApp      
      dockerfile: Dockerfile   
      args:
        - REACT_APP_BACKEND_URL=http://localhost/stockpapertrading
    ports:
      - "8002:8002"             
    restart: always            
    environment:
      PORT: 8002
      DATABASE_URL: "host=host.docker.internal user=mahmoudagag dbname=stocktrading port=5432 sslmode=disable"
      API_KEY: "tZa6ihrqO217vvPdFvs0q5jc4FCFZseS52YGNnfL"
      JWT_ENCRIPTION_KEY: "FkdcFb5Dsa"

  mealsy:
    build:
      context: ./Mealsy       
      dockerfile: Dockerfile  
      args:
        - REACT_APP_BACKEND_URL=http://localhost/mealsy
    command: sh -c "npx prisma migrate deploy && node app.js"
    ports:
      - "7002:7002"            
    restart: always         
    environment:
      PORT: 7002
      DATABASE_URL: "postgresql://mahmoudagag@host.docker.internal:5432/mealsy"
      JWT_SECRET: "BC5kVNZjOF"
      JWT_LIFETIME: "1d"
      API_KEY: "j1SvC0/dlV9huEqfruyNRA==iWtoDdyERSYTsHXN"

  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      DOMAIN_NAME: localhost
    depends_on:
      - whatstheword
      - portfoliowebsite
      - stockpapertrading
      - mealsy
